name: Probe candidate sources (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          exec > >(tee /tmp/probe.txt) 2>&1
          UA="PhDMentorFinder/1.0 (mailto:utpol.dnet@gmail.com)"
          probe() { code=$(curl -s -L -A "$UA" -o /tmp/b -w "%{http_code} %{content_type} %{size_download}" --max-time 40 "$1"); echo "== $1 -> $code"; head -c ${2:-300} /tmp/b | tr '\n' ' ' | sed 's/  */ /g'; echo; }
          python3 - <<'PY'
          import json,urllib.request,re,html,time
          UA={"User-Agent":"PhDMentorFinder/1.0 (+https://utpol-utmb.github.io; mailto:utpol.dnet@gmail.com)"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read().decode("utf-8","ignore")
          d=json.loads(get("https://dataportal.arc.gov.au/NCGP/API/grants?page%5Bsize%5D=3"))
          print("ARC", json.dumps(d["data"][0],indent=1)[:4000]); print("ARC meta", d["meta"]); print([x["id"] for x in d["data"]])
          d=json.loads(get("https://dataportal.arc.gov.au/NCGP/API/grants?page%5Bsize%5D=3&page%5Bnumber%5D=2000"));print("ARC p2000",[ (x["id"],x["attributes"].get("funding-commencement-year")) for x in d["data"]])
          time.sleep(1)
          dp=get("https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_profile%3A447")
          ids=sorted(set(re.findall(r'href="/jobs/(\d+)"',dp))); print("R1 ids",ids, "pager", re.findall(r'href="(\?[^"]*page=\d+[^"]*)"',dp)[:4])
          time.sleep(2)
          dp=get("https://euraxess.ec.europa.eu/jobs/"+ids[-1])
          i=dp.find("Application Deadline"); print("RAW DEADLINE HTML", re.sub(r"\s+"," ",dp[i:i+900]))
          txt=html.unescape(re.sub(r"<[^>]+>","\n",re.sub(r"<script.*?</script>|<style.*?</style>","",dp,flags=re.S)));txt=re.sub(r"\n\s*\n+","\n",txt)
          i=txt.find("Job Information"); print("R1 DETAIL", txt[i:i+1500]); j=txt.find("Where to apply"); print("APPLY", txt[j:j+800]); k=txt.find("Work Location"); print("LOC",txt[k:k+500])
          PY
      - name: Save results to branch probe-results
        if: always()
        run: |
          cd /tmp && mkdir pr && cd pr && git init -q && cp /tmp/probe.txt . && (cp /tmp/probe_subfields.json subfields.json 2>/dev/null || true); git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -q -m "probe $(date -u +%FT%T)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/probe-results
