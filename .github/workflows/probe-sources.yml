name: Probe candidate sources (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          exec > >(tee /tmp/probe.txt) 2>&1
          UA="PhDMentorFinder/1.0 (mailto:utpol.dnet@gmail.com)"
          probe() { code=$(curl -s -L -A "$UA" -o /tmp/b -w "%{http_code} %{content_type} %{size_download}" --max-time 40 "$1"); echo "== $1 -> $code"; head -c ${2:-300} /tmp/b | tr '\n' ' ' | sed 's/  */ /g'; echo; }
          python3 - <<'PY'
          import json,urllib.request
          out=[]
          for page in (1,2):
              u=f"https://api.openalex.org/subfields?per-page=200&page={page}&select=id,display_name,field,domain,display_name_alternatives&mailto=utpol.dnet@gmail.com"
              d=json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"PhDMentorFinder/1.0"})))
              out+=d["results"]
          json.dump(out,open("/tmp/subfields.json","w"))
          print("subfields",len(out))
          u="https://api.openalex.org/authors?search=Sean%20O%27Mahony&per-page=1&mailto=utpol.dnet@gmail.com"
          a=json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"PhDMentorFinder/1.0"})))["results"][0]
          print("AUTHOR KEYS",list(a.keys())); print(json.dumps(a.get("topics",[])[:2])[:800]); print(json.dumps(a.get("last_known_institutions"))[:600])
          w="https://api.openalex.org/works?filter=author.id:"+a["id"].split("/")[-1]+"&sort=publication_date:desc&per-page=2&select=id,title,publication_year,doi,primary_location&mailto=utpol.dnet@gmail.com"
          print(json.dumps(json.load(urllib.request.urlopen(w)))[:1200])
          i="https://api.openalex.org/institutions/"+a["last_known_institutions"][0]["id"].split("/")[-1]+"?select=homepage_url,ror,display_name,country_code,geo"
          print(json.dumps(json.load(urllib.request.urlopen(i))))
          PY
          cp /tmp/subfields.json /tmp/probe_subfields.json
      - name: Save results to branch probe-results
        if: always()
        run: |
          cd /tmp && mkdir pr && cd pr && git init -q && cp /tmp/probe.txt . && cp /tmp/probe_subfields.json subfields.json 2>/dev/null; git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -q -m "probe $(date -u +%FT%T)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/probe-results
