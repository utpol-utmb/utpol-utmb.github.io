name: Probe candidate sources (manual)
# Manual test bench: runs the full live data build into a scratch folder (nothing is
# published or committed to main) and saves the reports to the "probe-results" branch.
on:
  workflow_dispatch:
    inputs:
      force_sources:
        description: "Comma list of sources to switch on for this scratch build (e.g. arc,euraxess)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - name: Live build into scratch folder
        env:
          PMF_FORCE_SOURCES: ${{ inputs.force_sources }}
        run: |
          set -o pipefail
          python pipeline/build.py --out /tmp/out 2>&1 | tail -80 | tee /tmp/probe.txt
      - name: Save results to branch probe-results
        if: always()
        run: |
          mkdir -p /tmp/pr && cd /tmp/pr && git init -q
          cp /tmp/probe.txt . 2>/dev/null || true
          for f in health.json meta.json positions.json funding.json mentors-index.json; do cp /tmp/out/$f . 2>/dev/null || true; done
          mkdir -p shard && cp /tmp/out/mentors/00.json shard/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/pipeline/cache/source_state.json . 2>/dev/null || true
          git add . && git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -q -m "probe $(date -u +%FT%T)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/probe-results
