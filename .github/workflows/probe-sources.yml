name: Probe candidate sources (manual)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          exec > >(tee /tmp/probe.txt) 2>&1
          UA="PhDMentorFinder/1.0 (mailto:utpol.dnet@gmail.com)"
          probe() { code=$(curl -s -L -A "$UA" -o /tmp/b -w "%{http_code} %{content_type} %{size_download}" --max-time 40 "$1"); echo "== $1 -> $code"; head -c ${2:-300} /tmp/b | tr '\n' ' ' | sed 's/  */ /g'; echo; }
          python3 - <<'PY'
          import json,urllib.request,re,html,time
          UA={"User-Agent":"PhDMentorFinder/1.0 (+https://utpol-utmb.github.io; mailto:utpol.dnet@gmail.com)"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read().decode("utf-8","ignore")
          d=json.loads(get("https://dataportal.arc.gov.au/NCGP/API/grants?page%5Bsize%5D=2&filter=status%3Dactive"))
          print("ARC", json.dumps(d)[:3500])
          print("ARC ROBOTS:", get("https://dataportal.arc.gov.au/robots.txt")[:300] if True else "")
          t=get("https://euraxess.ec.europa.eu/jobs/search")
          facets=re.findall(r'href="(/jobs/search\?f%5B0%5D=job_research_profile%3A\d+)"[^>]*aria-label="Filter by ([^"]+)"',t)
          print("EUR FACETS",facets[:10])
          fields=re.findall(r'aria-label="Filter by ([^"]+)"',t); print("EUR LABELS",sorted(set(fields))[:80])
          time.sleep(2)
          pg=get("https://euraxess.ec.europa.eu/jobs/search?keywords=PhD")
          ids=sorted(set(re.findall(r'href="/jobs/(\d+)"',pg))); print("EUR kw=PhD ids",len(ids),ids[:5])
          print("PAGER", re.findall(r'href="(\?[^"]*page=\d+[^"]*)"',pg)[:5])
          time.sleep(2)
          dp=get("https://euraxess.ec.europa.eu/jobs/"+ids[0])
          txt=html.unescape(re.sub(r"<[^>]+>","\n",re.sub(r"<script.*?</script>|<style.*?</style>","",dp,flags=re.S)))
          txt=re.sub(r"\n\s*\n+","\n",txt)
          i=txt.find("Research Field"); print("EUR DETAIL", txt[max(0,i-1500):i+4000])
          PY
      - name: Save results to branch probe-results
        if: always()
        run: |
          cd /tmp && mkdir pr && cd pr && git init -q && cp /tmp/probe.txt . && (cp /tmp/probe_subfields.json subfields.json 2>/dev/null || true); git add .
          git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -q -m "probe $(date -u +%FT%T)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/probe-results
