name: Build Android app

# Press "Run workflow" on the Actions tab to build a new version for Google Play.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Work out the website address
        id: site
        run: |
          host=$(grep '^twaHost=' android/twa.properties | cut -d= -f2-)
          url=$(grep '^twaUrl=' android/twa.properties | cut -d= -f2-)
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY##*/}"
          if [ -z "$host" ]; then host="$owner.github.io"; fi
          if [ -z "$url" ]; then
            if [ "$repo" = "$owner.github.io" ]; then url="https://$host/"; else url="https://$host/$repo/"; fi
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "App opens $url"

      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret yet, so the app will be built unsigned (fine for a test, not for Google Play)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
          fi

      - name: Build app bundle (.aab) and test install file (.apk)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android bundleRelease assembleRelease -PtwaHost=${{ steps.site.outputs.host }} -PtwaUrl=${{ steps.site.outputs.url }}

      - uses: actions/upload-artifact@v4
        with:
          name: phd-mentor-finder-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
