name: Update data and publish site

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:        # lets you press "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - name: Test pipeline
        run: python -m pytest -q tests
      - name: Collect fresh data
        if: github.event_name != 'push'
        run: python pipeline/build.py
      - name: Save updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "mentor-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data pipeline/cache
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push
      - name: Write Android app link file
        run: python pipeline/assetlinks.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
