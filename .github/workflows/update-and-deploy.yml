name: Update data and publish site

# Runs every day on GitHub's servers. It calls the public APIs and feeds listed in
# pipeline/config.yaml, rebuilds site/data, commits it, and publishes the site.
# Nothing here needs anyone's approval. If a source breaks, the last good copy is kept
# and a GitHub issue labelled "data-health" is opened (GitHub emails the repo owner).

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:        # "Run workflow" button for a manual refresh
  push:
    branches: [main]        # a push only republishes the site; it does not collect data

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - name: Test pipeline
        run: python -m pytest -q tests
      - name: Collect fresh data
        id: build
        if: github.event_name != 'push'
        run: python pipeline/build.py
      - name: Report data health (opens or closes the data-health issue)
        if: always() && github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python pipeline/report_health.py site/data/health.json
      - name: Save updated data
        if: success() && github.event_name != 'push'
        run: |
          git config user.name "mentor-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data pipeline/cache
          git diff --cached --quiet || git commit -q -m "Daily data update $(date -u +%F)"
          git pull --rebase -q && git push -q
      - name: Write Android app link file
        if: success()
        run: python pipeline/assetlinks.py
      - uses: actions/configure-pages@v5
        if: success()
      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: site
      - id: deploy
        if: success()
        uses: actions/deploy-pages@v4
