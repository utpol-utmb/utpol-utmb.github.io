# PhD Mentor Finder — subject tree (Field > Subfield)
#
# HOW TO EDIT
#   * Add a subfield: copy a block under a field and change id, name, keywords and search.
#   * Add a field: copy a whole field block. Ids must be unique, lower-case, with dashes.
#   * Every field automatically gets a "General" bucket for items that fit the field
#     but no subfield, so nothing is ever dropped. Items that fit no field go to
#     "Other > General".
#
# WHAT THE KEYS DO
#   openalex  OpenAlex subfield codes (https://api.openalex.org/subfields). A researcher
#             matched in OpenAlex is tagged from the topics of their own papers using these
#             codes. This is the most reliable route, so prefer adding codes over keywords.
#   keywords  Word stems used to tag grant titles and job adverts (lower case, matched
#             anywhere in the text; put a space before a short stem to match word starts).
#   search    Terms the daily robot sends to the grant databases (NIH, NSF, UKRI, ARC).
#             Keep 1-2 per subfield; more terms = longer daily run.
#   openalex_fields  OpenAlex field codes (11-36) whose unmapped subfields fall into this
#             field's General bucket.
#   keywords (on a field)  Broad words that place an item in the field's General bucket
#             when no subfield keyword matches.
#   nih       false = do not send this field's search terms to NIH (not health-related).
#
# Based on the OpenAlex topic classification (domains > fields > subfields), which
# itself follows Scopus ASJC codes, so tags line up with how journals classify research.

