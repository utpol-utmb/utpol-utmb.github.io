# PhD Mentor Finder — data pipeline settings
# You can edit this file on GitHub (pencil icon). Lines starting with # are notes.

# Your email: sent to OpenAlex / NSF so they know who is calling (polite use).
contact_email: "utpol.dnet@gmail.com"

# Grant search terms come from pipeline/taxonomy.yaml (the "search" lists), so every
# field in the subject tree is covered. Add extra one-off terms here if you like.
extra_search_keywords:
  - palliative care
  - pharmacoepidemiology

# Longest time (minutes) each source may take per daily run.
minutes_per_source: 20
# OpenAlex looks up each new supervisor once; allow it longer.
openalex_minutes: 40
openalex_max_lookups: 2500
euraxess_minutes: 15

# How far back to look for grants (years). Active grants only are kept.
grant_lookback_years: 3

# Turn each source on (true) or off (false).
sources:
  nsf: true          # US National Science Foundation awards (free API)
  nih: true          # US NIH RePORTER grants incl. T32 training grants (free API)
  ukri: true         # UK Research and Innovation Gateway to Research (free API)
  openalex: true     # Papers, topics, citations and university website for each supervisor (CC0)
  # The three below are government sources. Before switching one on, add it to the
  # disclaimer and the Play Store description (README: "Legal and Play Store checklist").
  arc: false         # Australian Research Council grants (dataportal.arc.gov.au)
  euraxess: false    # EURAXESS (European Commission) PhD-level adverts
  sheet: false       # Your Google Sheet of extra positions (see sheet_csv_url)

# Curated adverts from these sites are kept in the file but NOT shown until the site
# allows it. jobs.ac.uk terms forbid reproducing its material without permission
# (permission requested Oct 2026). Remove a name here once permission is granted.
hold_sources:
  - jobs.ac.uk

# Removed sources (do not re-add): Nature Careers job feed (robots.txt disallows
# /naturecareers/jobsrss/), FindAPhD / Academic Positions / ScholarshipDB (block bots),
# ORCID public API (robots.txt disallows all), CORDIS data downloads (robots.txt disallows /data/).

# Check each scholarship's official page daily and list changed pages for the weekly review.
check_scholarship_pages: true

# Optional: a Google Sheet (File → Share → Publish to web → CSV) with columns
# matching data/curated/positions.json (title, supervisor, university, country, ...)
sheet_csv_url: ""

# Keep "open until filled" positions for this many days after first seen.
open_until_filled_days: 120

# Approximate exchange rates to USD, used only to sort/compare amounts.
# Always shown to users as "approx." — the original currency is kept.
usd_rates:
  USD: 1.0
  GBP: 1.27
  EUR: 1.08
  CHF: 1.13
  SEK: 0.095
  NOK: 0.094
  DKK: 0.145
  AUD: 0.66
  CAD: 0.73
  JPY: 0.0068
